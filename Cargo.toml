[package]
name = "xmip-core-route-header"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-route-header"
description = "Header route technology: `header:<protocol>.<name>` reads a header the transport delivered beside the bytes, from the `<protocol>.header.<name>` context key `context::property::header` builds; the name's case counts where the protocol's specification says it does. A xmip-core-route technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Source trait lives in route; a compiled reading
# takes a Message and its content, parsed once, which is path's.
route = { workspace = true }
path = { workspace = true }
message = { workspace = true }
context = { workspace = true }

[dev-dependencies]
# The tests write a filter as its expression.
expression = { workspace = true }
# Only the tests build a Message from its parts.
xcore = { workspace = true }

[lints]
workspace = true
